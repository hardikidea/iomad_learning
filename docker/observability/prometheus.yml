global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    platform: iomad-learning
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: iomad
    metrics_path: /health/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/monitor_metrics_token
    static_configs:
      - targets: ["iomad:8080"]

  - job_name: iomad-readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://iomad:8080/health/live
          - http://iomad:8080/health/ready
          - http://iomad:8080/health/startup
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
