pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    map $http_host $iomad_host_port {
        ~:([0-9]+)$ $1;
        default $server_port;
    }

    map $http_x_forwarded_proto $iomad_scheme_port {
        default $iomad_host_port;
        https 443;
        http 80;
    }

    map $http_x_forwarded_port $iomad_server_port {
        ~^[0-9]+$ $http_x_forwarded_port;
        default $iomad_scheme_port;
    }

    include /etc/nginx/conf.d/*.conf;
}
