name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}

services:
  # LAYER 1: Core AWS service emulator and real Docker-backed data engines.
  floci:
    container_name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_core
    image: ${FLOCI_IMAGE:-floci/floci:1.5.33@sha256:d2ecc8035822b23b8587a56eab15edd825f41d3fb80d93e8e66680410beddc08}
    user: "0:0"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ${AWS_REGION:-us-west-2}
      FLOCI_DEFAULT_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DOCKER_RESOURCE_NAMESPACE: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}
      FLOCI_SERVICES_DOCKER_NETWORK: ${FLOCI_NETWORK_NAME:-iomad_learning_floci}
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: ${FLOCI_POSTGRES_IMAGE:-postgres:16.14-bookworm}
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: ${FLOCI_RDS_PROXY_BASE_PORT:-7001}
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: ${FLOCI_RDS_PROXY_MAX_PORT:-7099}
      FLOCI_SERVICES_ELASTICACHE_DEFAULT_IMAGE: ${FLOCI_REDIS_IMAGE:-redis:7.4.9-bookworm}
      FLOCI_SERVICES_ELASTICACHE_PROXY_BASE_PORT: ${FLOCI_ELASTICACHE_PROXY_BASE_PORT:-16380}
      FLOCI_SERVICES_ELASTICACHE_PROXY_MAX_PORT: ${FLOCI_ELASTICACHE_PROXY_MAX_PORT:-16400}
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "false"
      FLOCI_SERVICES_SES_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci_state:/app/data
    ports:
      - "127.0.0.1:4566:4566"
      - >-
        127.0.0.1:${FLOCI_RDS_PROXY_BASE_PORT:-7001}-${FLOCI_RDS_PROXY_MAX_PORT:-7099}:${FLOCI_RDS_PROXY_BASE_PORT:-7001}-${FLOCI_RDS_PROXY_MAX_PORT:-7099}
      - >-
        127.0.0.1:${FLOCI_ELASTICACHE_PROXY_BASE_PORT:-16380}-${FLOCI_ELASTICACHE_PROXY_MAX_PORT:-16400}:${FLOCI_ELASTICACHE_PROXY_BASE_PORT:-16380}-${FLOCI_ELASTICACHE_PROXY_MAX_PORT:-16400}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_floci/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      local-cloud:
        aliases:
          - localhost.floci.io
    restart: unless-stopped

  # LAYER 2: Local AWS management and visual console.
  floci-ui:
    container_name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_ui
    image: ${FLOCI_UI_IMAGE:-floci/floci-ui:0.2.0@sha256:03a261144e0708993c8e48b763a0edb072415feae4325f254beeb1835fa424d9}
    environment:
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      PORT: "4500"
    depends_on:
      floci:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FLOCI_UI_PORT:-4500}:4500"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:4500/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - local-cloud
    restart: unless-stopped

  # LAYER 3A: IOMAD PHP-FPM application runtime.
  iomad-php:
    container_name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_php
    image: ${IOMAD_LOCAL_IMAGE:-iomad-learning-local:55b3128b8058d27f6cc4320850ca709ed5a792a9}
    build:
      context: .
      dockerfile: docker/iomad/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.8.10}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.3.0}
        IOMAD_REPO: ${IOMAD_REPO:-https://github.com/iomad/iomad.git}
        IOMAD_REF: ${IOMAD_REF:-IOMAD_501_STABLE}
        IOMAD_COMMIT: ${IOMAD_COMMIT:-55b3128b8058d27f6cc4320850ca709ed5a792a9}
        INCLUDE_IOMAD_SOURCE: "true"
    command: iomad-php-fpm
    env_file:
      - path: .env.local.runtime
        required: false
    depends_on:
      floci:
        condition: service_healthy
    volumes:
      - iomaddata:/var/www/iomaddata
      - ./institution-packs:/var/www/institution-packs:ro
    expose:
      - "9000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$s = @fsockopen("127.0.0.1", 9000, $$e, $$m, 2);
          exit($$s === false ? 1 : 0);'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - local-cloud
    restart: unless-stopped

  # LAYER 3B: Decoupled Nginx web runtime; layer 4 is declared as volumes below.
  web:
    container_name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_web
    image: ${IOMAD_LOCAL_IMAGE:-iomad-learning-local:55b3128b8058d27f6cc4320850ca709ed5a792a9}
    build:
      context: .
      dockerfile: docker/iomad/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.8.10}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.3.0}
        IOMAD_REPO: ${IOMAD_REPO:-https://github.com/iomad/iomad.git}
        IOMAD_REF: ${IOMAD_REF:-IOMAD_501_STABLE}
        IOMAD_COMMIT: ${IOMAD_COMMIT:-55b3128b8058d27f6cc4320850ca709ed5a792a9}
        INCLUDE_IOMAD_SOURCE: "true"
    command: iomad-nginx
    env_file:
      - path: .env.local.runtime
        required: false
    depends_on:
      iomad-php:
        condition: service_healthy
    volumes:
      - iomaddata:/var/www/iomaddata
      - ./docker/local/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${IOMAD_LOCAL_HTTP_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - local-cloud
    restart: unless-stopped

# LAYER 4: Application data and Floci metadata. Floci creates labelled,
# per-resource named volumes for each real RDS/ElastiCache child container.
volumes:
  floci_state:
    name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_state
  iomaddata:
    name: ${FLOCI_COMPOSE_PROJECT_NAME:-iomad_learning_floci}_iomaddata

networks:
  local-cloud:
    name: ${FLOCI_NETWORK_NAME:-iomad_learning_floci}
