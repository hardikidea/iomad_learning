services:
  iomad:
    container_name: ${COMPOSE_PROJECT_NAME:-iomad_learning}_app
    build:
      context: .
      dockerfile: docker/iomad/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.8.10}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.3.0}
        IOMAD_REPO: ${IOMAD_REPO:-https://github.com/iomad/iomad.git}
        IOMAD_REF: ${IOMAD_REF:-IOMAD_501_STABLE}
        IOMAD_COMMIT: ${IOMAD_COMMIT:-55b3128b8058d27f6cc4320850ca709ed5a792a9}
        INCLUDE_IOMAD_SOURCE: ${INCLUDE_IOMAD_SOURCE:-true}
    env_file:
      - .env
    user: "${IOMAD_RUNTIME_UID:-33}:${IOMAD_RUNTIME_GID:-33}"
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./iomaddata:/var/www/iomaddata:rw
      - ./institution-packs:/var/www/institution-packs:ro
      - ./backups:/var/backups/iomad:ro
    ports:
      - "127.0.0.1:${IOMAD_HTTP_PORT:-18080}:8080"
      - "127.0.0.1:${IOMAD_TENANT_HTTP_PORT:-80}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cron:
    container_name: ${COMPOSE_PROJECT_NAME:-iomad_learning}_cron
    build:
      context: .
      dockerfile: docker/iomad/Dockerfile
      args:
        PHP_IMAGE: ${PHP_IMAGE:-php:8.3-fpm-bookworm}
        COMPOSER_IMAGE: ${COMPOSER_IMAGE:-composer:2.8.10}
        PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.3.0}
        IOMAD_REPO: ${IOMAD_REPO:-https://github.com/iomad/iomad.git}
        IOMAD_REF: ${IOMAD_REF:-IOMAD_501_STABLE}
        IOMAD_COMMIT: ${IOMAD_COMMIT:-55b3128b8058d27f6cc4320850ca709ed5a792a9}
        INCLUDE_IOMAD_SOURCE: ${INCLUDE_IOMAD_SOURCE:-true}
    command: iomad-cron-loop
    env_file:
      - .env
    user: "${IOMAD_RUNTIME_UID:-33}:${IOMAD_RUNTIME_GID:-33}"
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    depends_on:
      db:
        condition: service_healthy
      iomad:
        condition: service_started
    volumes:
      - ./iomaddata:/var/www/iomaddata:rw
      - ./institution-packs:/var/www/institution-packs:ro
      - ./backups:/var/backups/iomad:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /tmp/iomad-cron-heartbeat &&
          last="$$(cat /tmp/iomad-cron-heartbeat)" &&
          now="$$(date +%s)" &&
          test "$$((now - last))" -le "${IOMAD_CRON_HEALTH_MAX_AGE:-900}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  db:
    container_name: ${COMPOSE_PROJECT_NAME:-iomad_learning}_db
    image: ${POSTGRES_IMAGE:-postgres:16-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iomad}
      POSTGRES_USER: ${POSTGRES_USER:-iomad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iomad_dev_password}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-iomad_learning}_redis
    image: ${REDIS_IMAGE:-redis:7-bookworm}
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    container_name: ${COMPOSE_PROJECT_NAME:-iomad_learning}_mailpit
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27.8}
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"
    environment:
      MP_UI_BIND_ADDR: 0.0.0.0:8025
      MP_SMTP_BIND_ADDR: 0.0.0.0:1025

volumes:
  postgres_data:
  redis_data:
