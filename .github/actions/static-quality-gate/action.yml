name: Static Quality Gate
description: Run repository static checks for Renovate, shell, YAML, Dockerfile, and Terraform.

inputs:
  renovate_cli_version:
    description: Renovate CLI version used for config validation.
    required: true
  moodle_cs_version:
    description: Pinned Moodle PHP coding standard release.
    required: true

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_wrapper: false

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: "8.3"
        tools: composer:v2
        coverage: none

    - name: Install lint tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends shellcheck yamllint

    - name: Validate Renovate config
      shell: bash
      run: npx --yes --package "renovate@${{ inputs.renovate_cli_version }}" -- renovate-config-validator --strict

    - name: Install Moodle coding standard
      shell: bash
      run: |
        set -euo pipefail
        composer global config --no-plugins \
          allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
        composer global require --no-interaction --prefer-dist \
          "moodlehq/moodle-cs:${{ inputs.moodle_cs_version }}"
        echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

    - name: PHP syntax
      shell: bash
      run: |
        set -euo pipefail
        find iomad-overrides -type f -name '*.php' -print0 |
          xargs -0 -n1 php -l

    - name: Moodle PHP coding standard
      shell: bash
      run: phpcs --standard=phpcs.xml.dist

    - name: ShellCheck scripts
      shell: bash
      run: shellcheck init-local-cloud.sh scripts/*.sh docker/iomad/*.sh

    - name: Repository contracts
      shell: bash
      run: ./scripts/test-repository.sh

    - name: Commercial reporting admission baseline
      shell: bash
      run: ./scripts/validate-commercial-reporting.sh

    - name: YAML lint
      shell: bash
      run: >-
        yamllint
        .github/workflows
        .github/actions
        docker/observability
        docker-compose.yml
        docker-compose.local.yml
        docker-compose.observability.yml

    - name: GitHub Actions lint
      uses: rhysd/actionlint@v1

    - name: Dockerfile lint
      uses: hadolint/hadolint-action@v3.3.0
      with:
        dockerfile: docker/iomad/Dockerfile
        config: .hadolint.yaml

    - name: Terraform format
      shell: bash
      run: terraform fmt -check -recursive terraform

    - name: Terraform validate without backend
      shell: bash
      run: |
        set -euo pipefail
        for dir in terraform/bootstrap terraform/envs/dev terraform/envs/stage terraform/envs/prod; do
          terraform -chdir="${dir}" init -backend=false -input=false
          terraform -chdir="${dir}" validate
        done
