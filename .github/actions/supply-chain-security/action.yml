name: Supply Chain Security
description: Run dependency, secret, filesystem, and IaC scans and generate a CycloneDX SBOM.

inputs:
  trivy_version:
    description: Trivy version to use.
    required: true

runs:
  using: composite
  steps:
    - name: Bootstrap IOMAD source
      shell: bash
      run: ./scripts/bootstrap-iomad.sh

    - name: Composer vulnerability audit
      shell: bash
      run: |
        set -euo pipefail
        audit_dir="$(mktemp -d)"
        trap 'rm -rf "${audit_dir}"' EXIT
        cp iomad/composer.json "${audit_dir}/composer.json"
        if [ -f iomad-overrides/composer.lock ]; then
          cp iomad-overrides/composer.lock "${audit_dir}/composer.lock"
        else
          cp iomad/composer.lock "${audit_dir}/composer.lock"
        fi
        docker run --rm \
          -v "${audit_dir}:/app" \
          -w /app \
          composer:2.8.10 \
          composer audit --locked --format=plain

    - name: Trivy secret scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy_version }}
        scan-type: fs
        scan-ref: .
        scanners: secret
        exit-code: "1"
        skip-dirs: iomaddata,backups,iomad/.git

    - name: Trivy filesystem and IaC audit
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy_version }}
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
        skip-dirs: iomaddata,backups,iomad/.git
        trivyignores: .trivyignore.yaml

    - name: Generate CycloneDX SBOM
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        version: ${{ inputs.trivy_version }}
        scan-type: fs
        scan-ref: .
        scanners: vuln
        format: cyclonedx
        output: repository-sbom.cdx.json
        skip-dirs: iomaddata,backups,iomad/.git
        trivyignores: .trivyignore.yaml

    - name: Upload CycloneDX SBOM
      uses: actions/upload-artifact@v4
      with:
        name: repository-sbom-${{ github.sha }}
        path: repository-sbom.cdx.json
        if-no-files-found: error
